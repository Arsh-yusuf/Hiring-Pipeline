[alembic]
script_location = app/db/migrations
prepend_sys_path = ..
version_path_separator = os
# Note: sqlalchemy.url is dynamically overridden by env.py using DATABASE_URL from .env
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/hiring_pipeline

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S