[project]
name = "mini-hiring-pipeline-backend"
version = "0.1.0"
description = "Backend for Mini Hiring Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn>=0.30.0,<0.31.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.2,<3.0.0",
    "sqlalchemy>=2.0.34,<3.0.0",
    "alembic>=1.13.2,<2.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "httpx>=0.27.2,<0.28.0",
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
]

[project.scripts]
run-backend = "uvicorn backend.app.main:app --reload --host 0.0.0.0 --port 8000"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
